name: Build C#

on:
  push:
    paths: ["src/**", "test/**", "*.sln", ".github/workflows/dotnet.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build TeamBytes.sln
